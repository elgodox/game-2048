<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="2048" />
  <meta name="theme-color" content="#100e0c" />
  <meta name="description" content="2048 en modo oscuro. Sumá fichas, llegá al 2048. PWA para iPhone." />
  <title>2048</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650;9..144,750&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="shell">
    <header class="hud">
      <div class="brand" aria-label="2048">2048</div>
      <div class="hud-right">
        <div class="scores">
          <div class="stat" id="score-box">
            <span class="stat-label">Score</span>
            <span class="stat-value" id="score">0</span>
            <span class="score-pop" id="score-pop" hidden></span>
          </div>
          <div class="stat">
            <span class="stat-label">Best</span>
            <span class="stat-value" id="best">0</span>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn" id="btn-menu">Menú</button>
          <button type="button" class="btn" id="btn-board">Ranking</button>
        </div>
      </div>
    </header>

    <p class="tagline">Sumá los números y llegá a la ficha <em>2048</em></p>
    <p class="player-line">Jugás como <button type="button" class="name-chip" id="btn-name">Anónimo</button></p>

    <section class="board-wrap" id="board-wrap">
      <div class="board" id="board" aria-label="Tablero 4 por 4">
        <div class="grid" id="grid"></div>
        <div class="tiles" id="tiles"></div>
      </div>
    </section>

    <p class="hint" id="hint">Deslizá con el dedo · flechas o WASD</p>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <script src="/game.js"></script>
</body>
</html>
